name: stockpilot

services:
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23.26.2-slim-faststart}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: ${DB_USERNAME:-STOCKPILOT}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    shm_size: 1gb
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
