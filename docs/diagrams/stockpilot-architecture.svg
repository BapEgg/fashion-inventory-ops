<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">StockPilot MVP 시스템 아키텍처</title>
  <desc id="description">로컬 React와 Spring Boot, Docker Oracle, 선택적 외부 LLM의 실행 및 데이터 흐름</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, 'Noto Sans KR', sans-serif; fill: #64748b; }
      .zone-title { font: 700 18px Arial, 'Noto Sans KR', sans-serif; fill: #334155; }
      .box-title { font: 700 16px Arial, 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .box-sub { font: 12px Consolas, 'Noto Sans KR', monospace; fill: #475569; }
      .box-copy { font: 13px Arial, 'Noto Sans KR', sans-serif; fill: #334155; }
      .status { font: 700 11px Arial, 'Noto Sans KR', sans-serif; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .flow-gray { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow-gray); }
      .flow-optional { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
      .label { font: 700 11px Arial, 'Noto Sans KR', sans-serif; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
      .legend { font: 12px Arial, 'Noto Sans KR', sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="32" y="38" class="title">StockPilot MVP 시스템 아키텍처</text>
  <text x="1468" y="37" class="subtitle" text-anchor="end">로컬 애플리케이션 + Docker Oracle + 선택적 LLM</text>

  <!-- Boundaries -->
  <rect x="190" y="65" width="865" height="790" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="216" y="98" class="zone-title">Local Host</text>
  <text x="1018" y="96" class="subtitle" text-anchor="end">빠른 개발·디버깅</text>

  <rect x="1095" y="255" width="370" height="515" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1121" y="288" class="zone-title">Docker Compose</text>
  <text x="1438" y="286" class="subtitle" text-anchor="end">유일한 서버 인프라</text>

  <!-- Actor -->
  <g filter="url(#shadow)">
    <rect x="25" y="332" width="130" height="128" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  </g>
  <circle cx="90" cy="365" r="16" fill="#334155"/>
  <path d="M 58 421 Q 58 386 90 386 Q 122 386 122 421 Z" fill="#64748b"/>
  <text x="90" y="444" class="box-title" text-anchor="middle">재고 담당자</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="235" y="175" width="255" height="245" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <rect x="255" y="195" width="83" height="23" rx="11" fill="#dbeafe"/>
  <text x="296" y="211" class="status" fill="#1d4ed8" text-anchor="middle">기반 구현</text>
  <text x="255" y="250" class="box-title">React 업무 화면</text>
  <text x="255" y="272" class="box-sub">React 19 · TypeScript · Vite</text>
  <line x1="255" y1="292" x2="470" y2="292" stroke="#e2e8f0"/>
  <text x="255" y="320" class="box-copy">• 재고 예외 목록</text>
  <text x="255" y="345" class="box-copy">• 상세 계산 근거</text>
  <text x="255" y="370" class="box-copy">• 수량 시뮬레이션</text>
  <text x="255" y="397" class="subtitle">화면 기능은 MVP 구현 대상</text>

  <!-- Environment -->
  <g filter="url(#shadow)">
    <rect x="235" y="485" width="255" height="115" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  </g>
  <text x="255" y="518" class="box-title">로컬 설정</text>
  <text x="255" y="542" class="box-sub">ignored root .env</text>
  <text x="255" y="570" class="box-copy">DB 접속 · 선택적 LLM 설정</text>

  <!-- Seed -->
  <g filter="url(#shadow)">
    <rect x="235" y="660" width="255" height="125" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <rect x="255" y="680" width="83" height="23" rx="11" fill="#dbeafe"/>
  <text x="296" y="696" class="status" fill="#1d4ed8" text-anchor="middle">구현 완료</text>
  <text x="255" y="732" class="box-title">Schema · Seed</text>
  <text x="255" y="756" class="box-sub">CSV 검증 → Flyway SQL</text>

  <!-- Backend boundary -->
  <rect x="535" y="125" width="475" height="660" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="558" y="160" class="zone-title">Spring Boot Backend</text>
  <text x="985" y="158" class="box-sub" text-anchor="end">Java 21 · localhost:8080</text>

  <!-- REST -->
  <g filter="url(#shadow)">
    <rect x="570" y="200" width="185" height="105" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  </g>
  <rect x="588" y="218" width="88" height="22" rx="11" fill="#ede9fe"/>
  <text x="632" y="233" class="status" fill="#6d28d9" text-anchor="middle">구현 예정</text>
  <text x="588" y="268" class="box-title">REST API</text>
  <text x="588" y="288" class="box-sub">분석 · 조회 · 결정</text>

  <!-- Domain Rules -->
  <g filter="url(#shadow)">
    <rect x="790" y="200" width="185" height="105" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  </g>
  <rect x="808" y="218" width="88" height="22" rx="11" fill="#ede9fe"/>
  <text x="852" y="233" class="status" fill="#6d28d9" text-anchor="middle">구현 예정</text>
  <text x="808" y="268" class="box-title">Java 업무 규칙</text>
  <text x="808" y="288" class="box-sub">예외 · 우선순위 · 수량</text>

  <!-- Batch -->
  <g filter="url(#shadow)">
    <rect x="570" y="360" width="185" height="105" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  </g>
  <rect x="588" y="378" width="88" height="22" rx="11" fill="#ede9fe"/>
  <text x="632" y="393" class="status" fill="#6d28d9" text-anchor="middle">구현 예정</text>
  <text x="588" y="428" class="box-title">Spring Batch</text>
  <text x="588" y="448" class="box-sub">반복 가능한 일괄 분석</text>

  <!-- Persistence -->
  <g filter="url(#shadow)">
    <rect x="790" y="360" width="185" height="105" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
  </g>
  <rect x="808" y="378" width="88" height="22" rx="11" fill="#ede9fe"/>
  <text x="852" y="393" class="status" fill="#6d28d9" text-anchor="middle">구현 예정</text>
  <text x="808" y="428" class="box-title">JPA 영속성</text>
  <text x="808" y="448" class="box-sub">도메인 저장 · 조회</text>

  <!-- Flyway -->
  <g filter="url(#shadow)">
    <rect x="570" y="520" width="185" height="105" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <rect x="588" y="538" width="83" height="22" rx="11" fill="#dbeafe"/>
  <text x="629" y="553" class="status" fill="#1d4ed8" text-anchor="middle">검증 완료</text>
  <text x="588" y="588" class="box-title">Flyway</text>
  <text x="588" y="608" class="box-sub">Schema · Seed · Batch 메타</text>

  <!-- Optional AI -->
  <g filter="url(#shadow)">
    <rect x="790" y="520" width="185" height="105" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  </g>
  <rect x="808" y="538" width="83" height="22" rx="11" fill="#e2e8f0"/>
  <text x="849" y="553" class="status" fill="#475569" text-anchor="middle">기본 비활성</text>
  <text x="808" y="588" class="box-title">LLM Adapter</text>
  <text x="808" y="608" class="box-sub">Java 결과 설명만 담당</text>

  <text x="558" y="687" class="box-copy">결정 원칙</text>
  <text x="558" y="713" class="subtitle">수량·상태 계산은 Java, LLM은 자연어 설명만 수행</text>
  <text x="558" y="740" class="subtitle">인증·Redis·Kafka·별도 서버는 MVP 범위에서 제외</text>

  <!-- External LLM -->
  <g filter="url(#shadow)">
    <rect x="1130" y="80" width="300" height="125" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 6"/>
  </g>
  <rect x="1150" y="100" width="83" height="23" rx="11" fill="#e2e8f0"/>
  <text x="1191" y="116" class="status" fill="#475569" text-anchor="middle">추후 선택</text>
  <text x="1150" y="153" class="box-title">외부 LLM Provider</text>
  <text x="1150" y="177" class="box-sub">API Key 제공 후 연결</text>

  <!-- Oracle -->
  <g filter="url(#shadow)">
    <rect x="1130" y="325" width="300" height="245" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <rect x="1152" y="347" width="83" height="23" rx="11" fill="#dbeafe"/>
  <text x="1193" y="363" class="status" fill="#1d4ed8" text-anchor="middle">검증 완료</text>
  <ellipse cx="1280" cy="415" rx="62" ry="22" fill="#dbeafe" stroke="#2563eb"/>
  <path d="M 1218 415 V 477 C 1218 489 1246 499 1280 499 C 1314 499 1342 489 1342 477 V 415" fill="#eff6ff" stroke="#2563eb"/>
  <ellipse cx="1280" cy="477" rx="62" ry="22" fill="#eff6ff" stroke="#2563eb"/>
  <text x="1280" y="529" class="box-title" text-anchor="middle">Oracle Database Free 23ai</text>
  <text x="1280" y="550" class="box-sub" text-anchor="middle">FREEPDB1 · localhost:1521</text>

  <!-- Volume -->
  <g filter="url(#shadow)">
    <rect x="1165" y="635" width="230" height="90" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  </g>
  <text x="1280" y="671" class="box-title" text-anchor="middle">Docker Volume</text>
  <text x="1280" y="696" class="box-sub" text-anchor="middle">oracle-data · 데이터 유지</text>

  <!-- Flows -->
  <path class="flow" d="M 155 396 H 235"/>
  <text x="195" y="385" class="label" text-anchor="middle">업무 사용</text>
  <path class="flow" d="M 490 270 H 570"/>
  <text x="530" y="259" class="label" text-anchor="middle">HTTP</text>
  <path class="flow" d="M 755 252 H 790"/>
  <text x="772" y="241" class="label" text-anchor="middle">호출</text>
  <path class="flow" d="M 662 360 V 305 H 790"/>
  <text x="711" y="326" class="label" text-anchor="middle">분석</text>
  <path class="flow" d="M 882 305 V 360"/>
  <text x="893" y="336" class="label">저장 모델</text>
  <path class="flow" d="M 975 412 H 1068 V 445 H 1130"/>
  <text x="1052" y="431" class="label" text-anchor="middle">JDBC</text>
  <path class="flow" d="M 755 572 H 1068 V 490 H 1130"/>
  <text x="1000" y="560" class="label" text-anchor="middle">Migration</text>
  <path class="flow" d="M 490 723 H 530 V 572 H 570"/>
  <text x="530" y="651" class="label" text-anchor="middle">버전 적용</text>
  <path class="flow-optional" d="M 975 572 H 1070 V 143 H 1130"/>
  <text x="1070" y="345" class="label" text-anchor="middle">계산 결과만 전달</text>
  <path class="flow-gray" d="M 1280 570 V 635"/>
  <text x="1292" y="608" class="label">영속 저장</text>
  <!-- Legend -->
  <rect x="35" y="828" width="12" height="12" rx="2" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="839" class="legend">현재 검증된 기반</text>
  <rect x="175" y="828" width="12" height="12" rx="2" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="196" y="839" class="legend">MVP 구현 대상</text>
  <rect x="318" y="828" width="12" height="12" rx="2" fill="#e2e8f0" stroke="#64748b"/>
  <text x="339" y="839" class="legend">선택 기능</text>
</svg>
