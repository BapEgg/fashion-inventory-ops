<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">StockPilot MVP-2 목표 아키텍처</title>
  <desc id="desc">합성 ERP POS WMS 입력에서 Oracle, Spring Batch 품질 검사와 수요 신호, 재고 예외, 이동 제약, 복수 시나리오, API, React 워크벤치, 사람의 결정과 ERP 이동지시 초안으로 이어지는 구조. AI는 계산 사실만 설명한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.subtitle{font:14px Arial,'Noto Sans KR',sans-serif;fill:#475569}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.lane-title{font:700 15px Arial,'Noto Sans KR',sans-serif;fill:#334155}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:12}.current{fill:#fff7ed;stroke:#ea580c}.target{fill:#eff6ff;stroke:#2563eb}.external{fill:#f8fafc;stroke:#64748b}.human{fill:#f0fdf4;stroke:#16a34a}.ai{fill:#faf5ff;stroke:#9333ea;stroke-dasharray:7 5}.label{font:700 15px Arial,'Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle}.small{font:12px Arial,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}.legend{font:13px Arial,'Noto Sans KR',sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="55" y="52" class="title">StockPilot MVP-2 목표 아키텍처</text>
  <text x="55" y="80" class="subtitle">MVP-1 Oracle·Batch·API·React 기준선은 보존하고, 파란 노드는 승인된 MVP-2 목표(미구현)입니다.</text>

  <rect x="40" y="115" width="1520" height="180" rx="16" class="lane"/>
  <text x="65" y="145" class="lane-title">입력·결정론적 분석</text>
  <rect x="70" y="175" width="170" height="82" class="box external"/>
  <text x="155" y="205" class="label">합성 업무 입력</text><text x="155" y="228" class="small">ERP · POS · WMS 경계</text>
  <rect x="285" y="175" width="150" height="82" class="box current"/>
  <text x="360" y="205" class="label">Oracle</text><text x="360" y="228" class="small">원본 · 결과 · 감사</text>
  <rect x="480" y="175" width="150" height="82" class="box current"/>
  <text x="555" y="205" class="label">Spring Batch</text><text x="555" y="228" class="small">버전·멱등 실행</text>
  <rect x="675" y="175" width="150" height="82" class="box target"/>
  <text x="750" y="202" class="label">품질·관측</text><text x="750" y="225" class="small">누락 · OOS · 최신성</text>
  <rect x="870" y="175" width="150" height="82" class="box target"/>
  <text x="945" y="202" class="label">수요 신호</text><text x="945" y="225" class="small">유형 · 신뢰도</text>
  <rect x="1065" y="175" width="150" height="82" class="box target"/>
  <text x="1140" y="202" class="label">재고 예외</text><text x="1140" y="225" class="small">심각도 · 정렬 키</text>
  <rect x="1260" y="175" width="150" height="82" class="box target"/>
  <text x="1335" y="202" class="label">제약·시나리오</text><text x="1335" y="225" class="small">후보 · low/base/high</text>
  <path d="M240 216 H285" class="edge"/><path d="M435 216 H480" class="edge"/><path d="M630 216 H675" class="edge"/><path d="M825 216 H870" class="edge"/><path d="M1020 216 H1065" class="edge"/><path d="M1215 216 H1260" class="edge"/>

  <rect x="40" y="325" width="1520" height="205" rx="16" class="lane"/>
  <text x="65" y="355" class="lane-title">검토·결정·외부 실행 경계</text>
  <rect x="250" y="395" width="175" height="86" class="box current"/>
  <text x="337" y="426" class="label">Spring REST API</text><text x="337" y="449" class="small">조회 · 계산 · 결정</text>
  <rect x="500" y="395" width="175" height="86" class="box current"/>
  <text x="587" y="426" class="label">React 워크벤치</text><text x="587" y="449" class="small">목록 · 상세 · 비교</text>
  <rect x="750" y="395" width="175" height="86" class="box human"/>
  <text x="837" y="426" class="label">담당자 판단</text><text x="837" y="449" class="small">보류 · 승인 · 거절</text>
  <rect x="1000" y="395" width="175" height="86" class="box target"/>
  <text x="1087" y="426" class="label">이동지시 초안</text><text x="1087" y="449" class="small">실제 재고 변경 없음</text>
  <rect x="1250" y="395" width="175" height="86" class="box external"/>
  <text x="1337" y="426" class="label">ERP · WMS · TMS</text><text x="1337" y="449" class="small">실제 실행 책임</text>
  <path d="M1335 257 V300 H337 V395" class="edge"/>
  <path d="M425 438 H500" class="edge"/><path d="M675 438 H750" class="edge"/><path d="M925 438 H1000" class="edge"/><path d="M1175 438 H1250" class="edge dashed"/>

  <rect x="40" y="560" width="1520" height="135" rx="16" class="lane"/>
  <text x="65" y="590" class="lane-title">선택적 AI 경계</text>
  <rect x="515" y="610" width="260" height="58" class="box ai"/>
  <text x="645" y="634" class="label">AI 설명 / 허용 조회 보조</text><text x="645" y="654" class="small">구조화된 계산 사실만 입력</text>
  <rect x="845" y="610" width="260" height="58" class="box ai"/>
  <text x="975" y="634" class="label">금지: 수량·우선순위·상태 결정</text><text x="975" y="654" class="small">비활성 상태도 핵심 흐름 정상</text>
  <path d="M645 610 V540 H337 V481" class="edge dashed"/><path d="M775 639 H845" class="edge dashed"/>

  <rect x="1195" y="720" width="20" height="14" class="current"/><text x="1225" y="732" class="legend">MVP-1 구현 기준선</text>
  <rect x="1360" y="720" width="20" height="14" class="target"/><text x="1390" y="732" class="legend">승인된 MVP-2 목표(미구현)</text>
</svg>
