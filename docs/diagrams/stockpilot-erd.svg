<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
  <title id="title">StockPilot MVP-2 논리 ERD</title>
  <desc id="desc">기존 상품 매장 판매 재고 분석 지표 추천 결정 테이블을 보존·확장하고 이벤트 입고 진행중 이동 경로 정책 품질 플래그 후보 사유 시나리오 이동지시 초안 승인 근거 오류 카탈로그를 추가한, 구현·검증된 데이터 모델.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.subtitle{font:14px Arial,'Noto Sans KR',sans-serif;fill:#475569}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.groupTitle{font:700 16px Arial,'Noto Sans KR',sans-serif;fill:#334155}.table{fill:#fff;stroke-width:2;rx:10}.existing{stroke:#ea580c}.new{stroke:#2563eb}.headOld{fill:#fff7ed}.headNew{fill:#eff6ff}.name{font:700 14px Consolas,monospace;fill:#0f172a}.tag{font:11px Arial,'Noto Sans KR',sans-serif;fill:#64748b}.field{font:12px Consolas,'Noto Sans KR',sans-serif;fill:#334155}.line{stroke:#e2e8f0}.rel{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}.legend{font:13px Arial,'Noto Sans KR',sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1800" height="1400" fill="#fff"/>
  <text x="45" y="48" class="title">StockPilot MVP-2 논리 ERD</text>
  <text x="45" y="76" class="subtitle">주황은 V1부터 존재하는 테이블의 호환 확장, 파랑은 MVP-2에서 추가돼 구현·검증된 신규 논리 테이블입니다.</text>

  <rect x="35" y="105" width="1730" height="450" rx="16" class="group"/><text x="60" y="136" class="groupTitle">입력 계약 · SYNTHETIC / versioned</text>
